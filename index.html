<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>English Player</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0f172a;
        --bg-card: #1e293b;
        --bg-hover: #334155;
        --accent: #38bdf8;
        --accent-dim: #0ea5e9;
        --text: #f1f5f9;
        --text-dim: #94a3b8;
        --text-muted: #64748b;
        --player-bg: #1e293b;
        --border: #334155;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        -webkit-tap-highlight-color: transparent;
      }

      .header {
        padding: 12px 16px 8px;
        flex-shrink: 0;
      }

      .header h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header h1 .icon {
        width: 28px;
        height: 28px;
        background: var(--accent);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .cat-tabs {
        display: flex;
        gap: 4px;
        background: var(--bg-card);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 10px;
      }

      .cat-tab {
        flex: 1;
        padding: 8px 12px;
        border: none;
        background: transparent;
        color: var(--text-dim);
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .cat-tab.active {
        background: var(--accent);
        color: #0f172a;
      }

      .cd-tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 6px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .cd-tabs::-webkit-scrollbar {
        display: none;
      }

      .cd-tab {
        flex-shrink: 0;
        padding: 6px 14px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 600;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .cd-tab.active {
        background: var(--accent-dim);
        border-color: var(--accent-dim);
        color: #fff;
      }

      .search-wrap {
        margin-top: 10px;
        position: relative;
      }

      .search-wrap input {
        width: 100%;
        padding: 10px 14px 10px 36px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text);
        font-size: 14px;
        border-radius: 10px;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-wrap input:focus {
        border-color: var(--accent);
      }

      .search-wrap .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 14px;
      }
      .track-list {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 10px 12px 140px;
      }

      .track-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin-bottom: 6px;
        background: var(--bg-card);
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .track-item:active {
        background: var(--bg-hover);
      }
      .track-item.playing {
        background: var(--accent-dim);
      }

      .track-num {
        width: 26px;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }
      .track-item.playing .track-num {
        color: #fff;
      }

      .track-title {
        flex: 1;
        min-width: 0;
        font-size: 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-eq {
        display: none;
        gap: 2px;
        align-items: flex-end;
        height: 14px;
        flex-shrink: 0;
      }
      .track-item.playing .track-eq {
        display: flex;
      }
      .eq-bar {
        width: 3px;
        background: #fff;
        border-radius: 1px;
        animation: eq 0.8s infinite ease-in-out;
      }
      .eq-bar:nth-child(2) {
        animation-delay: 0.2s;
      }
      .eq-bar:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes eq {
        0%,
        100% {
          height: 35%;
        }
        50% {
          height: 100%;
        }
      }

      .empty-state {
        text-align: center;
        color: var(--text-muted);
        padding: 40px 20px;
        font-size: 14px;
      }

      /* Player bar */
      .player-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--player-bg);
        border-top: 1px solid var(--border);
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        z-index: 100;
      }

      .player-top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .player-title {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-cd {
        flex-shrink: 0;
        font-size: 11px;
        color: var(--text-dim);
      }

      .progress-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .time {
        font-size: 11px;
        color: var(--text-dim);
        width: 36px;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .time.right {
        text-align: right;
      }

      .seek {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        outline: none;
        cursor: pointer;
      }
      .seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
      }
      .seek::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .ctrl-btn {
        background: none;
        border: none;
        color: var(--text);
        font-size: 20px;
        cursor: pointer;
        padding: 6px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .play-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--accent);
        color: #0f172a;
        font-size: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        cursor: pointer;
        padding-left: 6px;
        padding-bottom: 5px;
      }
      .speed-btn {
        font-size: 20px;
        font-weight: 700;
        padding: 7px 10px;
        background: var(--bg-hover);
        border-radius: 12px;
        color: var(--text);
        border: none;
        cursor: pointer;
        min-width: 42px;
        transition: background 0.2s;
      }
      .speed-btn.flash {
        background: var(--accent);
        color: #0f172a;
      }

      /* Speed bottom sheet */
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 200;
      }
      .sheet-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--player-bg);
        border-radius: 16px 16px 0 0;
        padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
        transform: translateY(100%);
        transition: transform 0.25s;
        z-index: 201;
      }
      .sheet.open {
        transform: translateY(0);
      }

      .sheet-handle {
        width: 36px;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        margin: 0 auto 12px;
      }
      .sheet-title {
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 12px;
      }
      .speed-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .speed-opt {
        padding: 12px 0;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .speed-opt.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1><span class="icon">🎧</span>English Player</h1>
      <div class="cat-tabs" id="catTabs"></div>
      <div class="cd-tabs" id="cdTabs"></div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          id="searchInput"
          placeholder="Search tracks…"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="track-list" id="trackList"></div>

    <div class="player-bar">
      <div class="player-top">
        <div class="player-title" id="playerTitle">Select a track</div>
        <div class="player-cd" id="playerCd"></div>
      </div>
      <div class="progress-row">
        <span class="time" id="timeCur">0:00</span>
        <input
          type="range"
          class="seek"
          id="seek"
          min="0"
          max="100"
          value="0"
          step="0.1"
        />
        <span class="time right" id="timeTotal">0:00</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btnPrev" aria-label="Previous">⏮</button>
        <button class="play-btn" id="btnPlay" aria-label="Play">▶</button>
        <button class="ctrl-btn" id="btnNext" aria-label="Next">⏭</button>
        <button class="speed-btn" id="btnSpeed">1x</button>
      </div>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Playback speed</div>
      <div class="speed-grid" id="speedGrid"></div>
    </div>

    <script src="tracks.js"></script>
    <script>
      (function () {
        "use strict";

        var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];

        // Build { category: { cd: [tracks] } } from TRACKS ("cat/CD" keys)
        var cats = {};
        Object.keys(TRACKS).forEach(function (key) {
          var i = key.indexOf("/");
          var cat = key.slice(0, i);
          var cd = key.slice(i + 1);
          if (!cats[cat]) cats[cat] = {};
          cats[cat][cd] = TRACKS[key];
        });
        var catNames = Object.keys(cats).sort();

        function cdNames(cat) {
          return Object.keys(cats[cat]).sort();
        }

        var state = {
          category: catNames[0] || "",
          cd: "",
          query: "",
          queue: [],
          queueIndex: -1,
          currentSrc: "",
          playing: false,
          rate: 1,
        };

        var audio = new Audio();
        audio.preload = "metadata";

        function $(id) {
          return document.getElementById(id);
        }
        var catTabsEl = $("catTabs"),
          cdTabsEl = $("cdTabs");
        var trackListEl = $("trackList"),
          searchInput = $("searchInput");
        var playerTitle = $("playerTitle"),
          playerCd = $("playerCd");
        var seek = $("seek"),
          timeCur = $("timeCur"),
          timeTotal = $("timeTotal");
        var btnPlay = $("btnPlay"),
          btnPrev = $("btnPrev"),
          btnNext = $("btnNext");
        var btnSpeed = $("btnSpeed"),
          speedGrid = $("speedGrid");
        var sheet = $("sheet"),
          backdrop = $("sheetBackdrop");

        function fmt(s) {
          if (!isFinite(s) || s < 0) return "0:00";
          s = Math.floor(s);
          return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
        }

        // ---- Tabs ----
        function renderCatTabs() {
          catTabsEl.innerHTML = "";
          catNames.forEach(function (cat) {
            var b = document.createElement("button");
            b.className = "cat-tab" + (cat === state.category ? " active" : "");
            b.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
            b.addEventListener("click", function () {
              if (state.category === cat) return;
              state.category = cat;
              state.cd = cdNames(cat)[0];
              state.query = "";
              searchInput.value = "";
              renderAll();
            });
            catTabsEl.appendChild(b);
          });
        }

        function renderCdTabs() {
          cdTabsEl.innerHTML = "";
          cdNames(state.category).forEach(function (cd) {
            var b = document.createElement("button");
            b.className = "cd-tab" + (cd === state.cd ? " active" : "");
            b.textContent = cd;
            b.addEventListener("click", function () {
              if (state.cd === cd) return;
              state.cd = cd;
              renderCdTabs();
              renderTrackList();
            });
            cdTabsEl.appendChild(b);
          });
        }

        // ---- Track list ----
        function currentList() {
          var out = [];
          if (state.query) {
            var q = state.query.toLowerCase();
            catNames.forEach(function (cat) {
              cdNames(cat).forEach(function (cd) {
                cats[cat][cd].forEach(function (t, i) {
                  if (t.title.toLowerCase().indexOf(q) !== -1) {
                    out.push({
                      title: t.title,
                      src: t.src,
                      category: cat,
                      cd: cd,
                      num: i + 1,
                    });
                  }
                });
              });
            });
            return out;
          }
          return cats[state.category][state.cd].map(function (t, i) {
            return {
              title: t.title,
              src: t.src,
              category: state.category,
              cd: state.cd,
              num: i + 1,
            };
          });
        }

        function renderTrackList() {
          var list = currentList();
          trackListEl.innerHTML = "";
          if (!list.length) {
            trackListEl.innerHTML =
              '<div class="empty-state">No tracks found</div>';
            return;
          }
          list.forEach(function (t, i) {
            var item = document.createElement("div");
            item.className =
              "track-item" + (t.src === state.currentSrc ? " playing" : "");
            var num = document.createElement("span");
            num.className = "track-num";
            num.textContent = t.num;
            var title = document.createElement("span");
            title.className = "track-title";
            title.textContent = t.title;
            var eq = document.createElement("span");
            eq.className = "track-eq";
            eq.innerHTML =
              '<span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>';
            item.appendChild(num);
            item.appendChild(title);
            item.appendChild(eq);
            item.addEventListener("click", function () {
              playIndex(i);
            });
            trackListEl.appendChild(item);
          });
        }

        function playIndex(i) {
          var list = currentList();
          var t = list[i];
          if (!t) return;
          state.queue = list;
          state.queueIndex = i;
          state.currentSrc = t.src;
          playerTitle.textContent = t.title;
          playerCd.textContent = t.category + " · " + t.cd;
          audio.src = t.src;
          audio.playbackRate = state.rate;
          var p = audio.play();
          if (p) p.catch(function () {});
          renderTrackList();
        }

        // ---- Player events ----
        var seekHeld = false;

        audio.addEventListener("timeupdate", function () {
          if (audio.duration && !seekHeld) {
            seek.value = (audio.currentTime / audio.duration) * 100;
          }
          timeCur.textContent = fmt(audio.currentTime);
        });
        audio.addEventListener("loadedmetadata", function () {
          timeTotal.textContent = fmt(audio.duration);
        });
        audio.addEventListener("play", function () {
          state.playing = true;
          btnPlay.textContent = "⏸";
          renderTrackList();
        });
        audio.addEventListener("pause", function () {
          state.playing = false;
          btnPlay.textContent = "▶";
          renderTrackList();
        });
        //audio.addEventListener('ended', function () { next(); });

        seek.addEventListener("input", function () {
          seekHeld = true;
        });
        seek.addEventListener("change", function () {
          if (audio.duration) {
            audio.currentTime = (seek.value / 100) * audio.duration;
          }
          seekHeld = false;
        });

        btnPlay.addEventListener("click", function () {
          if (state.queueIndex === -1) {
            playIndex(0);
            return;
          }
          if (audio.paused) audio.play();
          else audio.pause();
        });

        function next() {
          var list = currentList();
          if (state.queueIndex < list.length - 1) {
            playIndex(state.queueIndex + 1);
          }
        }

        function prev() {
          if (state.queueIndex > 0) {
            playIndex(state.queueIndex - 1);
          } else if (audio.currentTime > 3) {
            audio.currentTime = 0;
          }
        }

        btnNext.addEventListener("click", next);
        btnPrev.addEventListener("click", prev);

        // ---- Speed bottom sheet ----
        function renderSpeedGrid() {
          speedGrid.innerHTML = "";
          SPEEDS.forEach(function (s) {
            var b = document.createElement("button");
            b.className = "speed-opt" + (s === state.rate ? " active" : "");
            b.textContent = s + "x";
            b.addEventListener("click", function () {
              state.rate = s;
              audio.playbackRate = s;
              btnSpeed.textContent = s + "x";
              btnSpeed.classList.add("flash");
              setTimeout(function () {
                btnSpeed.classList.remove("flash");
              }, 500);
              renderSpeedGrid();
              closeSheet();
            });
            speedGrid.appendChild(b);
          });
        }

        function openSheet() {
          sheet.classList.add("open");
          backdrop.classList.add("open");
        }
        function closeSheet() {
          sheet.classList.remove("open");
          backdrop.classList.remove("open");
        }

        btnSpeed.addEventListener("click", openSheet);
        backdrop.addEventListener("click", closeSheet);
        sheet.addEventListener("click", function (e) {
          if (e.target === sheet) closeSheet();
        });

        // ---- Search ----
        searchInput.addEventListener("input", function () {
          state.query = searchInput.value.trim();
          renderTrackList();
        });

        // ---- Init ----
        function renderAll() {
          renderCatTabs();
          renderCdTabs();
          renderTrackList();
        }
        state.cd = cdNames(state.category)[0] || "";
        renderAll();
        renderSpeedGrid();
      })();
    </script>
  </body>
</html>
